name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check curriculum data (ordering, pinyin, components)
        run: node tools/validate.js
      - name: Engine tests
        run: node --test tools/test.js
      - name: Render today's lesson
        run: node tools/lesson.js
      - name: Check calendar feed is current
        run: |
          node tools/ics.js
          git diff --exit-code daily.ics || { echo "daily.ics is stale - run 'node tools/ics.js' and commit"; exit 1; }

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
