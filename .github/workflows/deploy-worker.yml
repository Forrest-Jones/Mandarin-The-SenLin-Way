name: Deploy API worker

# Deploys server/ to Cloudflare Workers whenever it changes on main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (dash.cloudflare.com → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template; add D1:Edit and Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID  (dashboard → Workers & Pages → Account ID on the right, or the 32-hex id in the dashboard URL)
# Optional: any of the secrets listed in "Sync secrets into the worker" below, pasted as GitHub secrets, are
# pushed into the worker on every deploy, so the Cloudflare dashboard is never needed.
# If the repository is connected through the Cloudflare Git integration instead, this workflow is
# redundant and skips itself when the secrets are absent.
on:
  push:
    branches: [main]
    paths: ['server/**', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test server/test/*.test.js
      - name: Which secrets does this run see? (names only, never values)
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          S_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          V_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          V_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STRIPE_SECRET_KEY ADMIN_KEY JWT_SECRET; do
            v="S_$n"; val="${!v}"
            if [ -n "$val" ]; then echo "secret $n: present (${#val} characters)"; else echo "secret $n: MISSING"; missing=1; fi
          done
          [ "$missing" = 1 ] && echo "Add the MISSING ones at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions (Secrets tab, exact names)." || true
          [ -n "$V_CLOUDFLARE_API_TOKEN" ] && echo "NOTE: CLOUDFLARE_API_TOKEN was added as a *Variable*, not a Secret. Delete it from the Variables tab and add it under Secrets." || true
          [ -n "$V_CLOUDFLARE_ACCOUNT_ID" ] && echo "NOTE: CLOUDFLARE_ACCOUNT_ID is a Variable; that is fine, using it." || true
      - name: Deploy with Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
      # Any of these GitHub repository secrets that exist are pushed into the worker as Cloudflare secrets,
      # so keys can be pasted in GitHub (Settings → Secrets and variables → Actions) instead of the Cloudflare dashboard.
      - name: Sync secrets into the worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
        run: |
          for name in JWT_SECRET ADMIN_KEY ANTHROPIC_API_KEY RESEND_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET AZURE_TTS_KEY AZURE_TTS_REGION GOOGLE_TTS_KEY DEEPGRAM_API_KEY OPENAI_API_KEY REVENUECAT_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" && echo "set $name"; else echo "skip $name (no GitHub secret)"; fi
          done
      - name: Run the one-shot Stripe setup (when ADMIN_KEY and STRIPE_SECRET_KEY exist)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.ADMIN_KEY != '' && env.STRIPE_SECRET_KEY != ''
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        working-directory: server
        run: |
          url=$(npx wrangler deployments list 2>/dev/null | grep -o 'https://[^ ]*workers.dev' | head -1 || true)
          if [ -z "$url" ]; then echo "could not read the worker URL; open /v1/admin/stripe-setup?key=... by hand"; exit 0; fi
          sleep 10
          curl -sS -H "x-admin-key: $ADMIN_KEY" "$url/v1/admin/stripe-setup" | sed 's/"webhookSecret":"[^"]*"/"webhookSecret":"***"/'
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; the Cloudflare Git integration deploys this worker instead."
