name: Deploy API worker

# Deploys server/ to Cloudflare Workers whenever it changes on main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (dash.cloudflare.com → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template; add D1:Edit and Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID  (dashboard → Workers & Pages → Account ID on the right, or the 32-hex id in the dashboard URL)
# Optional: any of the secrets listed in "Sync secrets into the worker" below, pasted as GitHub secrets, are
# pushed into the worker on every deploy, so the Cloudflare dashboard is never needed.
# If the repository is connected through the Cloudflare Git integration instead, this workflow is
# redundant and skips itself when the secrets are absent.
on:
  push:
    branches: [main]
    paths: ['server/**', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ccb05cb514e5966400f2edd418ca8688   # not a secret; also in wrangler.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test server/test/*.test.js
      - name: Which secrets does this run see? (names only, never values)
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S_DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          S_AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          S_GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for n in CLOUDFLARE_API_TOKEN STRIPE_SECRET_KEY ANTHROPIC_API_KEY RESEND_API_KEY DEEPGRAM_API_KEY AZURE_TTS_KEY GOOGLE_TTS_KEY OPENAI_API_KEY; do v="S_$n"; val="${!v}"; if [ -n "$val" ]; then echo "secret $n: present (${#val} characters)"; else echo "secret $n: missing (add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions with exactly this name)"; fi; done
      - name: Clean and verify the Cloudflare token
        id: token
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # strip whitespace, surrounding quotes, and a "Bearer " / "Authorization:" prefix that sometimes rides along when copying
          t="$CLOUDFLARE_API_TOKEN"
          t="$(printf '%s' "$t" | tr -d '[:space:]')"
          t="${t#Authorization:}"; t="${t#authorization:}"; t="${t#Bearer}"; t="${t#bearer}"
          t="${t#\"}"; t="${t%\"}"; t="${t#\'}"; t="${t%\'}"
          echo "::add-mask::$t"
          echo "cleaned token length: ${#t}"
          code=$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "verify HTTP $code"; python3 -c "import json;d=json.load(open('verify.json'));print('status:',(d.get('result') or {}).get('status'));print('errors:',d.get('errors'))"
          if [ "$code" != 200 ]; then echo "::error::Cloudflare does not recognise CLOUDFLARE_API_TOKEN. Create a fresh token at https://dash.cloudflare.com/profile/api-tokens (template 'Edit Cloudflare Workers'), click Copy on the final screen, and save it as the GitHub secret."; exit 1; fi
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - name: Deploy with Wrangler
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Worker deployed" >> "$GITHUB_STEP_SUMMARY"; echo "URL: $url" >> "$GITHUB_STEP_SUMMARY"
      # Any of these GitHub repository secrets that exist are pushed into the worker as Cloudflare secrets,
      # so keys can be pasted in GitHub (Settings → Secrets and variables → Actions) instead of the Cloudflare dashboard.
      - name: Sync secrets into the worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
        run: |
          for name in JWT_SECRET ADMIN_KEY ANTHROPIC_API_KEY RESEND_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET AZURE_TTS_KEY AZURE_TTS_REGION GOOGLE_TTS_KEY DEEPGRAM_API_KEY OPENAI_API_KEY REVENUECAT_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" && echo "set $name"; else echo "skip $name (no GitHub secret)"; fi
          done
      - name: Stripe setup (product, prices, webhook, portal) — needs only STRIPE_SECRET_KEY
        if: env.CLOUDFLARE_API_TOKEN != '' && env.STRIPE_SECRET_KEY != '' && steps.deploy.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        working-directory: server
        run: |
          set -o pipefail
          node scripts/stripe-setup.mjs | tee stripe.log
          echo "### Stripe" >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat stripe.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Health check
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outputs.url != ''
        run: |
          url="${{ steps.deploy.outputs.url }}"
          sleep 5
          echo "### Health" >> "$GITHUB_STEP_SUMMARY"
          for p in /v1/health /v1/billing/plans; do echo "GET $url$p"; curl -sS "$url$p" | tee -a "$GITHUB_STEP_SUMMARY"; echo; done
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; the Cloudflare Git integration deploys this worker instead."
