name: Build Android app (Play Store bundle)

# Builds the Trusted Web Activity wrapper (twa-manifest.json) into a signed .aab for Google Play and a
# signed .apk for side-loading, using Bubblewrap on a GitHub runner (JDK + Android SDK preinstalled).
# Signing key: on the first run a keystore is generated and stored, base64-encoded, in the worker's
# private KV namespace (Cloudflare, via CLOUDFLARE_API_TOKEN) so every later build signs with the same
# key. The key's SHA-256 fingerprint is written into .well-known/assetlinks.json and committed, which is
# what makes the app open full-screen without a browser bar.
# Optional: PLAY_SERVICE_ACCOUNT_JSON secret → the bundle is uploaded to the Play internal testing track.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['twa-manifest.json', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ccb05cb514e5966400f2edd418ca8688
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Bubblewrap and Wrangler
        run: npm i -g @bubblewrap/cli wrangler
      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          # Bubblewrap expects the SDK folder to hold the command-line tools' bin/ directly (its own download layout),
          # while the runner keeps them under cmdline-tools/latest. A symlink satisfies both.
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          [ -e "$sdk/bin" ] || sudo ln -s "$sdk/cmdline-tools/latest/bin" "$sdk/bin"
          [ -e "$sdk/lib" ] || sudo ln -s "$sdk/cmdline-tools/latest/lib" "$sdk/lib"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$sdk" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
      - name: Clean the Cloudflare token
        id: token
        run: |
          t="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; t="${t#Bearer}"; t="${t#\"}"; t="${t%\"}"
          echo "::add-mask::$t"; echo "token=$t" >> "$GITHUB_OUTPUT"
      - name: Fetch or create the signing key (kept in the worker's private KV)
        id: key
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -e
          ns=$(wrangler kv namespace list | python3 -c "import sys,json;l=json.load(sys.stdin);print(next((n['id'] for n in l if 'cache' in n['title'].lower() or 'senlin' in n['title'].lower()), '5267a4c90f99468597b32382f0351085'))")
          echo "namespace: $ns"
          if wrangler kv key get android:keystore --namespace-id "$ns" --remote > ks.b64 2>/dev/null && [ -s ks.b64 ]; then
            base64 -d ks.b64 > android.keystore
            pass=$(wrangler kv key get android:keystore-password --namespace-id "$ns" --remote)
            echo "using the stored signing key"
          else
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android.keystore -alias senlin -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Mandarin The SenLin Way, O=SenLin, C=US" > /dev/null 2>&1
            base64 -w0 android.keystore > ks.b64
            wrangler kv key put android:keystore --namespace-id "$ns" --remote --path ks.b64 > /dev/null
            printf '%s' "$pass" > pw.txt; wrangler kv key put android:keystore-password --namespace-id "$ns" --remote --path pw.txt > /dev/null; rm pw.txt
            echo "generated a new signing key and stored it in KV"
          fi
          echo "::add-mask::$pass"; echo "pass=$pass" >> "$GITHUB_OUTPUT"
          fp=$(keytool -list -v -keystore android.keystore -alias senlin -storepass "$pass" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"; echo "SHA-256: $fp"
          rm -f ks.b64
      - name: Build with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.key.outputs.pass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.key.outputs.pass }}
        run: |
          set -e
          # Every Play upload needs a higher versionCode: derive it from the run number (1.0.<run>).
          python3 - <<'PY'
          import json, os
          m = json.load(open('twa-manifest.json'))
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          m['appVersionCode'] = n; m['appVersionName'] = f"1.0.{n}"
          json.dump(m, open('twa-manifest.json', 'w'), indent=2)
          print('versionCode', n, 'versionName', m['appVersionName'])
          PY
          bubblewrap update --skipVersionUpgrade < /dev/null
          # Play requires new apps to target a recent API level. Bubblewrap's template already compiles against the
          # latest SDK (its androidx.browser dependency needs 36+), so only make sure targetSdk is never below 35.
          t=$(grep -oE 'targetSdkVersion [0-9]+' app/build.gradle | grep -oE '[0-9]+' || echo 0)
          if [ "${t:-0}" -lt 35 ]; then sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 35/' app/build.gradle; fi
          grep -nE 'compileSdkVersion|compileSdk |targetSdkVersion|targetSdk |minSdkVersion|minSdk |versionCode|versionName' app/build.gradle
          bubblewrap build --skipPwaValidation < /dev/null
          ls -la *.aab *.apk
      - name: Write the fingerprint into .well-known/assetlinks.json and commit it
        run: |
          fp="${{ steps.key.outputs.fingerprint }}"
          python3 - "$fp" <<'PY'
          import json, sys
          fp = sys.argv[1]
          p = '.well-known/assetlinks.json'
          data = json.load(open(p))
          data[0]['target']['sha256_cert_fingerprints'] = [fp]
          json.dump(data, open(p, 'w'), indent=2); open(p, 'a').write('\n')
          PY
          if ! git diff --quiet .well-known/assetlinks.json; then
            git config user.name "senlin-bot"; git config user.email "senlin-bot@users.noreply.github.com"
            git add .well-known/assetlinks.json && git commit -m "Android: record the signing key fingerprint in assetlinks.json" && git pull --rebase origin main && git push
          fi
      - name: Publish the build as a GitHub release (stable download links for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android build (latest)
          body: |
            Direct install on an Android phone: download **app-release-signed.apk** below, open it, allow the install.
            Google Play upload: **app-release-bundle.aab**.
            Signing key SHA-256: ${{ steps.key.outputs.fingerprint }}
          prerelease: true
          files: |
            app-release-bundle.aab
            app-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: senlin-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          retention-days: 30
      - name: Upload to Google Play (internal testing) when a service account is configured
        if: ${{ env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.senlinway.mandarin
          releaseFiles: app-release-bundle.aab
          track: internal
          status: completed
      - name: Summary
        run: |
          { echo "### Android build"; echo "- Bundle for Play Console: download the **senlin-android** artifact above (app-release-bundle.aab)"; echo "- Signing key SHA-256: \`${{ steps.key.outputs.fingerprint }}\`"; echo "- Next: Play Console → Create app → Testing → Internal testing → upload the .aab. Or add the PLAY_SERVICE_ACCOUNT_JSON secret and this workflow uploads it for you."; } >> "$GITHUB_STEP_SUMMARY"
