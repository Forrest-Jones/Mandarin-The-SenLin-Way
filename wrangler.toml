# Mandarin The SenLin Way — API worker (root config for the Cloudflare Git integration)
# The worker source lives in server/; this file lets a repository connected at its root deploy it
# with the default build settings (no build command, deploy command `npx wrangler deploy`).
name = "senlin-api"
main = "server/src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = true
account_id = "ccb05cb514e5966400f2edd418ca8688"

# Resources are provisioned automatically on first deploy when no id is given (Wrangler 4 resource
# provisioning). If your Wrangler refuses, run once: `npx wrangler deploy --x-provision`, or create
# them by hand (`wrangler d1 create senlin`, `wrangler kv namespace create CACHE`) and paste the ids.
[[d1_databases]]
binding = "DB"
database_name = "senlin"

[[kv_namespaces]]
binding = "CACHE"

[vars]
# Non-secret configuration. Anything sensitive goes in `wrangler secret put <NAME>` or the dashboard.
ALLOWED_ORIGINS = "https://forrest-jones.github.io,capacitor://localhost,https://localhost,http://localhost,ionic://localhost"   # the site plus the Capacitor app origins; add a custom domain here
VERSION = "2026.09.20"
ANTHROPIC_MODEL = "claude-sonnet-5"                  # default tutor model (fast, cheap); the client may request one from ANTHROPIC_ALLOWED_MODELS
ANTHROPIC_ALLOWED_MODELS = "claude-sonnet-5,claude-opus-5,claude-haiku-4-5-20251001"
TTS_PROVIDER = "azure"                               # 'azure' | 'google'
STT_PROVIDER = "deepgram"                            # 'deepgram' | 'openai'
EMAIL_FROM = "SenLin <hello@your-domain.com>"        # a domain verified in Resend
SITE_URL = "https://forrest-jones.github.io/Mandarin-The-SenLin-Way/"   # where Stripe Checkout returns to
# Stripe price ids are normally created and stored by GET /v1/admin/stripe-setup?key=ADMIN_KEY (needs the
# STRIPE_SECRET_KEY and ADMIN_KEY secrets). Set these only to override what it stored:
# STRIPE_PRICE_MONTHLY = "price_..."     # $11.99 / month
# STRIPE_PRICE_YEARLY = "price_..."      # $59.99 / year (the 7-day trial is added by the server at checkout)
# STRIPE_PRICE_LIFETIME = "price_..."    # $149.99 one-time
# PAYWALL = "1"                                      # uncomment to gate HSK 2+ and the Deal Desk behind Pro
# DEV = "1"                                          # allows http://localhost:8080 as an origin
# DEV_ECHO_CODE = "1"                                # returns the sign-in code in the API response (never in production)

# Secrets to set once (dashboard: Workers & Pages → senlin-api → Settings → Variables and Secrets, or `npx wrangler secret put NAME`):
#   JWT_SECRET                 long random string (openssl rand -hex 32) — signs sign-in tokens          [required]
#   ANTHROPIC_API_KEY          console.anthropic.com — the AI tutor                                       [required for Talk]
#   RESEND_API_KEY             resend.com — sign-in code emails                                            [required for sign-in]
#   AZURE_TTS_KEY + AZURE_TTS_REGION   portal.azure.com → Speech resource (e.g. region "eastus")           [if TTS_PROVIDER=azure]
#   GOOGLE_TTS_KEY             console.cloud.google.com → Text-to-Speech API key                          [if TTS_PROVIDER=google]
#   DEEPGRAM_API_KEY           console.deepgram.com — speech-to-text for iOS/Safari                        [if STT_PROVIDER=deepgram]
#   OPENAI_API_KEY             Whisper speech-to-text                                                      [if STT_PROVIDER=openai]
#   REVENUECAT_WEBHOOK_SECRET  RevenueCat → Integrations → Webhooks → Authorization header value
#   STRIPE_SECRET_KEY          Stripe → Developers → API keys (sk_live_… / sk_test_…) — creates Checkout and Customer Portal sessions
#   STRIPE_WEBHOOK_SECRET      Stripe → Developers → Webhooks → signing secret (whsec_…)
#   ADMIN_KEY                  any long random string — protects GET /v1/admin/stats
